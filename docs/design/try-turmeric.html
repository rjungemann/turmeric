<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try Turmeric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-base:      #0C0A08;
  --bg-surface:   #131109;
  --bg-panel:     #181512;
  --bg-hover:     #1F1C18;
  --border:       #252119;
  --border-mid:   #302B24;
  --border-str:   #3E3830;
  --gold:         #D48B1C;
  --gold-bright:  #EFA030;
  --gold-dim:     #7A5010;
  --gold-glow:    rgba(212,139,28,0.12);
  --text-primary: #EAE0D2;
  --text-sec:     #88796C;
  --text-dim:     #453F39;
  --syn-kw:       #EFA030;
  --syn-str:      #D9735A;
  --syn-cmt:      #48433D;
  --syn-type:     #7AC4B8;
  --syn-num:      #A8C98A;
  --syn-fn:       #C4A0E8;
  --syn-punc:     #6A5F58;
}

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
}

/* ── HEADER ─────────────────────────────── */
header {
  height: 54px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  width: 30px;
  height: 30px;
  background: var(--gold);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-weight: 600;
  color: #0A0800;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

.logo-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 23px;
  font-weight: 500;
  color: var(--gold-bright);
  letter-spacing: 0.01em;
  line-height: 1;
}

.logo-sub {
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  font-weight: 400;
  margin-left: 1px;
  align-self: flex-end;
  margin-bottom: 2px;
}

.nav-sep {
  width: 1px;
  height: 22px;
  background: var(--border-mid);
  margin: 0 6px;
}

nav a {
  font-size: 13px;
  color: var(--text-sec);
  text-decoration: none;
  padding: 5px 10px;
  border-radius: 5px;
  transition: color 0.12s, background 0.12s;
  font-weight: 400;
}
nav a:hover { color: var(--text-primary); background: var(--bg-hover); }

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 400;
  padding: 6px 13px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s;
  border: 1px solid var(--border-str);
  background: transparent;
  color: var(--text-sec);
  letter-spacing: 0.01em;
  line-height: 1;
}
.btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-str); }

.btn-run {
  background: var(--gold);
  border-color: var(--gold);
  color: #0A0800;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 16px;
}
.btn-run:hover { background: var(--gold-bright); border-color: var(--gold-bright); color: #0A0800; }
.btn-run:active { transform: scale(0.97); }

.run-tri {
  width: 0; height: 0;
  border-style: solid;
  border-width: 4px 0 4px 7px;
  border-color: transparent transparent transparent #0A0800;
}

/* ── TOOLBAR ─────────────────────────────── */
.toolbar {
  height: 38px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
}

.toolbar-label {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.sep { width: 1px; height: 18px; background: var(--border-mid); }

select.example-select {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  background: var(--bg-panel);
  color: var(--text-sec);
  border: 1px solid var(--border-mid);
  border-radius: 5px;
  padding: 4px 8px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.12s, color 0.12s;
}
select.example-select:hover { border-color: var(--border-str); color: var(--text-primary); }
select.example-select option { background: #1A1714; }

.keyboard-hint {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 5px;
}

.kbd {
  background: var(--bg-panel);
  border: 1px solid var(--border-str);
  border-radius: 3px;
  padding: 1px 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-sec);
}

/* ── MAIN SPLIT ──────────────────────────── */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* ── EDITOR PANE ─────────────────────────── */
.editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border-mid);
  min-width: 0;
}

.pane-header {
  height: 36px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 4px;
  flex-shrink: 0;
}

.tab {
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0 6px;
  padding-bottom: 1px;
  border-bottom: 1.5px solid transparent;
  transition: color 0.12s, border-color 0.12s;
  font-family: 'JetBrains Mono', monospace;
}
.tab:hover { color: var(--text-sec); }
.tab.active { color: var(--text-primary); border-bottom-color: var(--gold); }

.pane-badge {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-family: 'JetBrains Mono', monospace;
}

.editor-body {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
  background: var(--bg-base);
}

.line-numbers {
  width: 46px;
  flex-shrink: 0;
  padding: 16px 0;
  text-align: right;
  padding-right: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-dim);
  user-select: none;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
}

.code-area {
  flex: 1;
  min-width: 0;
  position: relative;
}

.code-textarea {
  position: absolute;
  inset: 0;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  color: transparent;
  caret-color: var(--gold);
  padding: 16px 16px 16px 14px;
  z-index: 2;
  overflow-y: auto;
}

.code-highlight {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-primary);
  padding: 16px 16px 16px 14px;
  white-space: pre;
  z-index: 1;
  overflow: hidden;
}

/* ── REPL PANE ───────────────────────────── */
.repl-pane {
  width: 44%;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  min-width: 300px;
  background: var(--bg-base);
}

.repl-output {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  line-height: 1.65;
  min-height: 0;
}

.rl { margin-bottom: 1px; }
.rl-prompt { color: var(--gold); }
.rl-input  { color: var(--text-primary); }
.rl-result { color: var(--syn-num); }
.rl-error  { color: var(--syn-str); }
.rl-comment{ color: var(--syn-cmt); }
.rl-type   { color: var(--text-dim); font-size: 11px; }
.rl-sep    {
  color: var(--text-dim);
  font-size: 11px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin: 10px 0 6px;
  letter-spacing: 0.04em;
}

.repl-input-row {
  height: 44px;
  border-top: 1px solid var(--border-mid);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
  flex-shrink: 0;
  background: var(--bg-surface);
}

.repl-caret {
  color: var(--gold);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  flex-shrink: 0;
  opacity: 0.9;
}

.repl-field {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-primary);
  caret-color: var(--gold);
}
.repl-field::placeholder { color: var(--text-dim); }

/* ── STATUS BAR ──────────────────────────── */
.statusbar {
  height: 24px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 18px;
  flex-shrink: 0;
}

.stat {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 5px;
  letter-spacing: 0.02em;
  font-family: 'DM Sans', sans-serif;
}

.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--syn-type);
  flex-shrink: 0;
}
.dot.running { background: var(--gold); animation: pulse 0.8s infinite; }
.dot.error   { background: var(--syn-str); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── SYNTAX COLORS ───────────────────────── */
.kw   { color: var(--syn-kw); }
.str  { color: var(--syn-str); }
.cmt  { color: var(--syn-cmt); font-style: italic; }
.tp   { color: var(--syn-type); }
.num  { color: var(--syn-num); }
.fn   { color: var(--syn-fn); }
.pnc  { color: var(--syn-punc); }
.op   { color: var(--text-sec); }

/* ── SCROLLBARS ──────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-str); border-radius: 2px; }

/* ── ANIMATIONS ──────────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.rl { animation: fadeIn 0.18s ease both; }
</style>
</head>
<body>

    <div class="repl-output" id="replOut">
      <div class="rl rl-comment">── Turmeric 0.9.1 · lightning-fast · purely functional ──</div>
      <div class="rl rl-comment">── Press Run or try an expression below ──</div>
      <div class="rl rl-comment"></div>
    </div>
    <div class="repl-input-row">
      <span class="repl-caret">λ</span>
      <input class="repl-field" id="replIn" placeholder="(+ 1 2)" onkeydown="onReplKey(event)">

</div>

<!-- ── STATUS BAR ─────────────────────────── -->
<div class="statusbar">
  <div class="stat">
    <div class="dot" id="statDot"></div>
    <span id="statText">Ready</span>
  </div>
  <div class="stat" id="cursorStat">Ln 1, Col 1</div>

<script>
/* ── Examples ──────────────────────────────── */
const examples = {
  basics: `;; Welcome to Turmeric — a lightning-fast functional language
;; Inspired by Clojure, Racket, and Haskell

(defn greet (name)
  (str "Hello, " name "!"))

(defn factorial (n)
  (match n
    | 0 => 1
    | n => (* n (factorial (- n 1)))))

(defn sum-to (n)
  (foldl + 0 (range 1 (+ n 1))))

(defn main ()
  (println (greet "world"))
  (println (str "10! = " (factorial 10)))
  (println (str "sum 1..100 = " (sum-to 100))))`,

  typeclasses: `;; Typeclasses — ad-hoc polymorphism in Turmeric

(deftype Maybe (a)
  | Nothing
  | Just a)

(defclass (Functor f)
  (fmap : (-> (-> a b) (f a) (f b))))

(defclass (Monad m) extends Functor
  (pure  : (-> a (m a)))
  (bind  : (-> (m a) (-> a (m b)) (m b))))

(impl Functor Maybe
  (defn fmap (f m)
    (match m
      | Nothing  => Nothing
      | (Just x) => (Just (f x)))))

(impl Monad Maybe
  (defn pure (x) (Just x))
  (defn bind (m f)
    (match m
      | Nothing  => Nothing
      | (Just x) => (f x))))

(defn safe-div (x y)
  (if (zero? y) Nothing (Just (/ x y))))

(defn main ()
  (println (fmap (* 2) (safe-div 10 5)))
  (println (bind (safe-div 10 0) (fn (x) (Just (+ x 1))))))`,

  effects: `;; Effect system — algebraic effects in Turmeric

(effect State (s)
  (get    : (-> Unit s))
  (put    : (-> s Unit))
  (modify : (-> (-> s s) Unit)))

(effect Log
  (log : (-> Str Unit)))

(defn counter-program ()
  (perform
    (log "Starting counter")
    (modify (+ 1))
    (modify (+ 1))
    (let n (get)
      (log (str "Final count: " n))
      n)))

(defn main ()
  (let (n logs) (run-state+log counter-program 0)
    (println (str "Result: " n))
    (for-each println logs)))`,

  fib: `;; Fibonacci — memoized with typeclasses

(deftype Pair (a b)
  | Pair a b)

(defn fib (n)
  (match n
    | 0 => 0
    | 1 => 1
    | n => (+ (fib (- n 1)) (fib (- n 2)))))

(defn fib-stream ()
  (let go (fn (a b) (cons a (lazy (go b (+ a b)))))
    (go 0 1)))

(defn main ()
  (println "First 15 Fibonacci numbers:")
  (println (take 15 (fib-stream)))
  (println (str "fib(30) = " (fib 30))))`,

  pipes: `;; Pipelines and function composition

(defn words (s)
  (split s " "))

(defn word-count (text)
  (-> text
    words
    (map str/lower)
    (group-by identity)
    (map-vals length)
    (sort-by snd)
    reverse))

(defn top-words (n text)
  (take n (word-count text)))

(defn main ()
  (let poem "the fog comes on little cat feet"
    (println "Top 3 words by frequency:")
    (for-each
      (fn ((Pair w c))
        (println (str "  " w ": " c)))
      (top-words 3 poem))))`
};

/* ── Syntax Highlighter ──────────────────── */
const KEYWORDS  = new Set(['defn','deftype','defclass','impl','let','match','if','do','fn','effect','perform','run-state','run-state+log','=>','defmacro','and','or','not','when','cond','case','letrec','module','import','export','for-each','lazy','extends']);
const TYPES     = new Set(['Int','Float','Str','Bool','Unit','Maybe','List','Either','IO','Effect','State','Log','Reader','Writer','Functor','Monad','Applicative','Pair']);
const BUILTINS  = new Set(['map','filter','foldl','foldr','reduce','range','length','reverse','str','println','print','zero?','odd?','even?','null?','head','tail','cons','append','take','drop','fmap','pure','bind','words','split','group-by','map-vals','sort-by','snd','identity','->']);

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function tokenize(code) {
  let out = '', i = 0;
  while (i < code.length) {
    const c = code[i];
    if (c === ';') {
      let j = i; while (j < code.length && code[j] !== '\n') j++;
      out += `<span class="cmt">${esc(code.slice(i,j))}</span>`; i = j; continue;
    }
    if (c === '"') {
      let j = i+1;
      while (j < code.length && code[j] !== '"') { if (code[j]==='\\') j++; j++; } j++;
      out += `<span class="str">${esc(code.slice(i,j))}</span>`; i = j; continue;
    }
    if (c === '\n') { out += '\n'; i++; continue; }
    if (c === ' ' || c === '\t') { out += c; i++; continue; }
    if ('()[]'.includes(c)) { out += `<span class="pnc">${c}</span>`; i++; continue; }
    if (c === '|') { out += `<span class="op">|</span>`; i++; continue; }
    let j = i;
    while (j < code.length && !' \t\n()[]'.includes(code[j])) j++;
    const tok = code.slice(i,j);
    if (!tok) { out += esc(c); i++; continue; }
    if (KEYWORDS.has(tok))  out += `<span class="kw">${esc(tok)}</span>`;
    else if (TYPES.has(tok)) out += `<span class="tp">${esc(tok)}</span>`;
    else if (BUILTINS.has(tok)) out += `<span class="fn">${esc(tok)}</span>`;
    else if (/^-?\d+(\.\d+)?$/.test(tok)) out += `<span class="num">${esc(tok)}</span>`;
    else out += esc(tok);
    i = j;
  }
  return out;
}

/* ── Editor Logic ────────────────────────── */
let currentKey = 'basics';

function loadExample(key) {
  currentKey = key;
  const ed = document.getElementById('editor');
  ed.value = examples[key];
  updateHighlight();
  updateLineNums();
}

function onEdit() { updateHighlight(); updateLineNums(); }

function updateHighlight() {
  const code = document.getElementById('editor').value;
  document.getElementById('highlight').innerHTML = tokenize(code);
}

function updateLineNums() {
  const n = (document.getElementById('editor').value.match(/\n/g)||[]).length + 1;
  document.getElementById('lineNums').textContent = Array.from({length:n},(_,i)=>i+1).join('\n');
}

function syncScroll() {
  const ed = document.getElementById('editor');
  document.getElementById('highlight').style.transform = `translateY(-${ed.scrollTop}px)`;
}

function onKey(e) {
  if ((e.metaKey||e.ctrlKey) && e.key==='Enter') { e.preventDefault(); runCode(); return; }
  if (e.key==='Tab') {
    e.preventDefault();
    const el = e.target, s = el.selectionStart;
    el.value = el.value.slice(0,s) + '  ' + el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = s+2;
    onEdit();
  }
}

function formatCode() {
  // no-op visual feedback
  setStatus('formatted', false);
  setTimeout(()=>setStatus('Ready',false),1500);
}

/* ── REPL Logic ──────────────────────────── */
let replHist = [], histIdx = -1;

function appendRepl(cls, text, delay=0) {
  setTimeout(() => {
    const out = document.getElementById('replOut');
    const d = document.createElement('div');
    d.className = 'rl ' + cls;
    d.textContent = text;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }, delay);
}

function clearRepl() {
  document.getElementById('replOut').innerHTML = '';
}

function runCode() {
  const out = document.getElementById('replOut');
  const sep = document.createElement('div');
  sep.className = 'rl rl-sep';
  sep.textContent = '── Run ─────────────────────────────────';
  out.appendChild(sep);
  out.scrollTop = out.scrollHeight;

  const lines = runOutputs[currentKey] || [['rl-comment','── Running… ──'],['rl-result','Done.']];
  setStatus('running', true);
  lines.forEach(([cls,text],i) => appendRepl(cls, text, 70*i));
  setTimeout(() => setStatus('Finished in ' + (Math.random()*3+0.5).toFixed(1) + 'ms', false), 70*lines.length+150);
}

function focusRepl() { document.getElementById('replIn').focus(); }

function onReplKey(e) {
  const field = document.getElementById('replIn');
  if (e.key==='Enter') {
    const input = field.value.trim();
    if (!input) return;
    replHist.unshift(input); histIdx=-1; field.value='';
    appendRepl('rl-prompt', 'λ ' + input);
    const r = replMap[input];
    if (r) {
      if (r.action==='clear') { setTimeout(clearRepl,100); return; }
      setTimeout(()=>{ appendRepl('rl-result', r.v); if(r.t) appendRepl('rl-type',r.t); }, 100);
    } else if (input.startsWith(':')) {
      setTimeout(()=>appendRepl('rl-error','error: unknown command — try :help'),100);
    } else if (input.startsWith('(') || input.startsWith('[')) {
      setTimeout(()=>{
        appendRepl('rl-error','error: unbound identifier or type mismatch');
        appendRepl('rl-type','hint: try (+ 1 2) or (factorial 10) or type :help');
      },100);
    } else {
      setTimeout(()=>appendRepl('rl-error','error: unexpected token — expected expression'),100);
    }
  }
  if (e.key==='ArrowUp') { if(histIdx<replHist.length-1){histIdx++;field.value=replHist[histIdx];} }
  if (e.key==='ArrowDown') { if(histIdx>0){histIdx--;field.value=replHist[histIdx];}else{histIdx=-1;field.value='';} }
}

function setStatus(text, isRunning) {
  document.getElementById('statText').textContent = text;
  document.getElementById('statDot').className = 'dot' + (isRunning?' running':'');
}

/* ── Init ─────────────────────────────────── */
loadExample('basics');
document.getElementById('editor').addEventListener('keyup', e => {
  const el = e.target;
  const lines = el.value.slice(0,el.selectionStart).split('\n');
  document.getElementById('cursorStat').textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length+1}`;
});
</script>
