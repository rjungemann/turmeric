name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libedit-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libedit || true

      - name: Configure (Debug + ASAN)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --output-on-failure --progress --test-dir build

  check-guides:
    name: Check guide toggle pairs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libedit-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build tur
        run: cmake --build build -j --target tur
      - name: Check guide pairs (AST-verified via tur parse-check)
        run: python3 tools/check-guide-pairs.py --tur build/tur docs/guides/

  check-spaced-types:
    name: Check spaced-type annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check fused annotations in stdlib/ and docs/guides/
        run: python3 tools/spaced-types-rewrite.py --check stdlib/ docs/guides/
