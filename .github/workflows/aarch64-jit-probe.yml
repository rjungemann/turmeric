name: aarch64 JIT include probe

# THROWAWAY DIAGNOSTIC -- delete this file and its branch once answered.
#
# v0.60.0's release failed on linux-aarch64:
#
#   /usr/include/aarch64-linux-gnu/sys/user.h:30:1: syntax error on struct
#   TUR-W0070: jit engine could not compile this program; falling back to cc
#
# Run 1 established the JIT unit's include set (build tree and extracted
# archive agree, byte for byte) and that the unit never writes __uint128_t
# itself -- so the token appears only inside that header, in
# `struct user_fpsimd_struct { __uint128_t vregs[32]; ... }`, which sits at the
# line c2mir names.  Run 1's `gcc -H` arm was useless: it ran without the JIT's
# -I flags and died on `hamt.h: No such file or directory`.
#
# This run answers the two questions that choose the fix, and needs no -I at
# all because it tests the SYSTEM headers directly:
#
#   chain   -- which of the unit's includes reaches sys/user.h, named rather
#              than guessed.  If it is incidental, dropping it is the whole fix.
#   uint128 -- whether c2mir rejects __uint128_t on its own, which says whether
#              the header is merely the messenger.

on:
  # A new workflow file is NOT dispatchable until it is on the default branch,
  # so this triggers on a push to its own throwaway branch instead.
  push:
    branches: [claude/aarch64-jit-include-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- the chain
  chain:
    name: Which include reaches sys/user.h
    runs-on: ubuntu-24.04-arm
    steps:
      - name: libc version
        run: ldd --version | head -1

      - name: Every /usr/include header that mentions sys/user.h
        run: grep -rln 'sys/user\.h' /usr/include 2>/dev/null | head -40 || echo "(none)"

      - name: Which of the JIT unit's own includes reaches it
        run: |
          # The unit's include set, from run 1's dump. Tested one at a time, as
          # the system headers alone -- no turmeric, no -I, nothing to go wrong.
          hdrs="sys/select.h sys/socket.h netinet/in.h arpa/inet.h ucontext.h
                setjmp.h stdio.h stdint.h stdbool.h pthread.h stdlib.h stddef.h
                string.h stdarg.h regex.h time.h unistd.h fcntl.h errno.h"
          for h in $hdrs; do
            printf '%-16s ' "$h"
            if printf '#include <%s>\n' "$h" \
                 | gcc -H -fsyntax-only -xc - 2>&1 | grep -q 'sys/user\.h'; then
              echo "REACHES sys/user.h"
            else
              echo "-"
            fi
          done

      - name: The same, under the macro the unit actually defines for ucontext.h
        run: |
          # The unit wraps that one include in `#define _XOPEN_SOURCE 700` /
          # `#undef`, and glibc's header content is feature-macro dependent, so
          # a bare test of ucontext.h is not the same question.
          printf '#define _XOPEN_SOURCE 700\n#include <ucontext.h>\n' \
            | gcc -H -fsyntax-only -xc - 2>&1 | grep -q 'sys/user\.h' \
            && echo "ucontext.h under _XOPEN_SOURCE 700: REACHES sys/user.h" \
            || echo "ucontext.h under _XOPEN_SOURCE 700: -"

      - name: The full chain, with each includer named
        run: |
          # -H indents one dot per nesting level, so the nearest preceding line
          # with one fewer dot is the includer. Print the whole tree for any
          # header that reached it, so the path is readable end to end.
          hdrs="sys/select.h sys/socket.h netinet/in.h arpa/inet.h ucontext.h
                setjmp.h pthread.h regex.h time.h unistd.h fcntl.h errno.h"
          for h in $hdrs; do
            printf '#include <%s>\n' "$h" \
              | gcc -H -fsyntax-only -xc - > /dev/null 2> tree.txt || true
            if grep -q 'sys/user\.h' tree.txt; then
              echo "##### <$h> -- full tree up to and including sys/user.h"
              sed -n '1,/sys\/user\.h/p' tree.txt
              echo ""
            fi
          done

  # -------------------------------------------------------------- the mechanism
  uint128:
    name: Does c2mir reject __uint128_t on its own
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libedit-dev

      - name: Configure and build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j

      - name: A program whose inline C writes __uint128_t
        run: |
          cat > u128.tur <<'EOF'
          (defn widen [x : int] : int
            ```c
            __uint128_t v = (__uint128_t)x;
            v = v * 3u;
            return (int64_t)v;
            ```)

          (defn main [] : int
            (println (widen 14))
            0)
          EOF
          set +e
          TUR_JIT_DUMP_C=u128-jit.c ./build/tur jit u128.tur 2>&1 | tee u128.log
          echo "---- exit: ${PIPESTATUS[0]} ----"
          if grep -q "TUR-W0070" u128.log; then
            echo "VERDICT: the JIT declined this program (see diagnostics above)"
          else
            echo "VERDICT: c2mir compiled __uint128_t fine -- the header is NOT"
            echo "         failing merely because of that token"
          fi

      - name: A program whose inline C includes sys/user.h directly
        run: |
          # Isolates the header from whatever transitively pulls it: if this
          # alone reproduces the same sys/user.h:30 error, the chain only
          # determines WHERE it enters, not whether it breaks.
          cat > suser.tur <<'EOF'
          (defn regs-size [] : int
            ```c
            #include <sys/user.h>
            return (int64_t)sizeof(struct user_regs_struct);
            ```)

          (defn main [] : int
            (println (regs-size))
            0)
          EOF
          set +e
          ./build/tur jit suser.tur 2>&1 | tee suser.log
          echo "---- exit: ${PIPESTATUS[0]} ----"
          grep -q "sys/user.h" suser.log \
            && echo "VERDICT: including sys/user.h alone reproduces it" \
            || echo "VERDICT: sys/user.h alone did NOT reproduce it"

      - name: Upload the logs and dumps
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aarch64-uint128-probe
          path: |
            u128.log
            u128-jit.c
            suser.log
          if-no-files-found: warn
