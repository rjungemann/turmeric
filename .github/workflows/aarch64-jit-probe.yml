name: aarch64 JIT include probe

# THROWAWAY DIAGNOSTIC -- delete this file and its branch once answered.
#
# Settled by runs 1 and 2:
#   * <ucontext.h> is the ONLY one of the JIT unit's 19 includes that reaches
#     sys/user.h, via aarch64 sys/ucontext.h -> sys/procfs.h (the only header
#     in /usr/include that includes sys/user.h).
#   * <ucontext.h> under _XOPEN_SOURCE 700 does NOT reach it -- but the unit
#     defines that macro at line 63, after <sys/select.h> (line 53) already
#     pulled in the include-guarded features.h, so on glibc it is inert.
#   * c2mir does not understand __uint128_t (inline C writing it produces extra
#     errors at the body that no other program produces).
#   * Hoisting the macro is ruled out by emit_module.c:13231 (T24) and :13246
#     (T21) -- macOS needs the BSD networking headers processed WITHOUT it, and
#     needs the full 880-byte ucontext_t.
#
# Run 3 asks whether fix option B is viable: keep sys/procfs.h out of the JIT
# unit by predefining its guard.  Three things have to hold, and the second is
# the one that could quietly ruin everything -- T21 exists BECAUSE ucontext_t's
# size depends on how its header was reached:
#
#   1. <ucontext.h> still compiles with sys/procfs.h stubbed out.
#   2. sizeof(ucontext_t) is UNCHANGED.  Measured by running a program, not by
#      reading headers.
#   3. the JIT then compiles a program instead of falling back to cc.
#
# (3) patches the emitter in the workflow rather than on the branch, so this
# branch stays a diagnostic and carries no pretend fix.

on:
  push:
    branches: [claude/aarch64-jit-include-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------- is the stub even safe?
  headers:
    name: Does stubbing sys/procfs.h keep ucontext intact
    runs-on: ubuntu-24.04-arm
    steps:
      - name: What aarch64 sys/ucontext.h takes from procfs.h
        run: |
          echo "--- its includes ---"
          grep -n '#include' /usr/include/aarch64-linux-gnu/sys/ucontext.h
          echo "--- every procfs/elf-ish identifier it mentions ---"
          grep -nE 'greg|gregset|fpregset|prgreg|elf_|prstatus' \
            /usr/include/aarch64-linux-gnu/sys/ucontext.h || echo "(none -- it only includes it)"

      - name: 1. does it still compile with the guard predefined

        run: |
          printf '#define _SYS_PROCFS_H 1\n#include <ucontext.h>\nint main(void){ucontext_t u;(void)u;return 0;}\n' > stub.c
          if gcc -fsyntax-only stub.c 2>&1; then
            echo "YES -- <ucontext.h> compiles with sys/procfs.h stubbed"
          else
            echo "::error::NO -- stubbing procfs.h breaks <ucontext.h>; option B is dead"
            exit 1
          fi

      - name: 1b. and does it stop reaching sys/user.h
        run: |
          gcc -H -fsyntax-only stub.c 2>&1 | grep -q 'sys/user\.h' \
            && { echo "::error::still reaches sys/user.h"; exit 1; } \
            || echo "confirmed: sys/user.h is no longer in the include tree"

      - name: 2. is sizeof(ucontext_t) unchanged -- the T21 question
        run: |
          # Run it, do not read headers: T21 exists because this size silently
          # changes with how <ucontext.h> was reached, and a wrong answer here
          # would corrupt every fiber rather than fail to build.
          printf '#include <ucontext.h>\n#include <stdio.h>\nint main(void){printf("%%zu\\n",sizeof(ucontext_t));return 0;}\n' > size-plain.c
          printf '#define _SYS_PROCFS_H 1\n#include <ucontext.h>\n#include <stdio.h>\nint main(void){printf("%%zu\\n",sizeof(ucontext_t));return 0;}\n' > size-stub.c
          gcc -o size-plain size-plain.c && plain=$(./size-plain)
          gcc -o size-stub  size-stub.c  && stub=$(./size-stub)
          echo "sizeof(ucontext_t): plain=$plain stubbed=$stub"
          if [ "$plain" = "$stub" ]; then
            echo "UNCHANGED -- the stub does not disturb the fiber layout"
          else
            echo "::error::CHANGED ($plain -> $stub) -- option B would corrupt fibers"
            exit 1
          fi

  # ------------------------------------------- does the JIT then compile?
  jit:
    name: Does the JIT compile with procfs stubbed
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libedit-dev

      - name: Baseline -- build unpatched and confirm the fallback
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j
          cat > hello.tur <<'EOF'
          (defn main [] : int
            (println "hello from the archive")
            0)
          EOF
          set +e
          ./build/tur jit hello.tur 2>&1 | tee before.log
          grep -q "TUR-W0070" before.log \
            && echo "BASELINE: falls back to cc, as the release leg saw" \
            || echo "::warning::baseline did NOT fall back -- the premise moved"

      - name: Patch the emitter in the workflow, not on the branch
        run: |
          # Throwaway: emit the glibc guard just before <ucontext.h>. A real fix
          # would scope this to __linux__ and justify it where T21/T24 are
          # documented; this only has to answer "does it work".
          perl -0pi -e 's{(buf_puts\(out, "#define _XOPEN_SOURCE 700\\n"\);)}{buf_puts(out, "#ifdef __linux__\\n#define _SYS_PROCFS_H 1\\n#endif\\n");\n    $1}' \
            src/compiler/emit_module.c
          grep -n -B2 -A2 '_SYS_PROCFS_H' src/compiler/emit_module.c | head -12

      - name: Rebuild and retest
        run: |
          cmake --build build -j
          set +e
          TUR_JIT_DUMP_C=after-jit.c ./build/tur jit hello.tur 2>&1 | tee after.log
          echo "---- exit: ${PIPESTATUS[0]} ----"
          if grep -q "TUR-W0070" after.log; then
            echo "::error::STILL falling back -- option B does not fix it"
          elif grep -q "sys/user.h" after.log; then
            echo "::error::sys/user.h still reached"
          else
            echo "OPTION B WORKS: the JIT engine compiled the program"
          fi

      - name: And the cc path still works
        run: |
          set +e
          ./build/tur run hello.tur 2>&1 | tee run.log
          grep -q "hello from the archive" run.log \
            && echo "cc path unaffected" \
            || echo "::error::the cc path broke"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aarch64-procfs-stub-probe
          path: |
            before.log
            after.log
            run.log
            after-jit.c
          if-no-files-found: warn
