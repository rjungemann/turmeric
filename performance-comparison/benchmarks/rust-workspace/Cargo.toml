# rust-workspace -- one binary per benchmark, matching the layout run_all.sh
# expects (target/release/<benchmark>).  Cargo auto-discovers every file in
# src/bin/ as its own binary, so a single `cargo build --release` builds all
# of them -- no per-binary [[bin]] table needed.  No external crates: every
# benchmark is expressible with std (HashMap, threads, files), keeping the
# build proxy-restricted-machine friendly like the Haskell column.
[package]
name = "turmeric-benchmarks-rs"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
